<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>
        Sharkord Desktop
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 28px;

            background:
                    radial-gradient(
                            circle at top,
                            rgba(88, 101, 242, 0.12),
                            transparent 36%
                    ),
                    #1e1f22;

            color: white;

            font-family:
                    "Segoe UI",
                    Arial,
                    sans-serif;
        }


        .box {
            width: 440px;

            padding: 30px;

            background: #2b2d31;

            border:
                    1px solid
                    rgba(255, 255, 255, 0.04);

            border-radius: 14px;

            box-shadow:
                    0 20px 55px
                    rgba(0, 0, 0, 0.26);
        }


        h1 {
            margin: 0 0 8px;

            font-size: 25px;
        }


        .description {
            margin-bottom: 24px;

            color: #b5bac1;

            font-size: 14px;

            line-height: 1.5;
        }


        .recent-label,
        label {
            display: block;

            margin-bottom: 8px;

            font-size: 12px;
            font-weight: 700;

            letter-spacing: 0.4px;

            color: #dbdee1;
        }


        #recent {
            display: none;

            margin-bottom: 20px;
        }


        .recent-card {
            width: 100%;

            display: flex;
            align-items: center;
            gap: 12px;

            padding: 12px;

            border:
                    1px solid #45474e;

            border-radius: 10px;

            background: #232428;

            cursor: pointer;

            transition:
                    border-color 120ms ease,
                    background 120ms ease,
                    transform 120ms ease;
        }


        .recent-card:hover {
            border-color: #5865f2;

            background: #27282d;

            transform: translateY(-1px);
        }


        .recent-avatar {
            flex: 0 0 auto;

            width: 52px;
            height: 52px;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background:
                    linear-gradient(
                            135deg,
                            #5865f2,
                            #7b5cff
                    );

            color: white;

            font-size: 17px;
            font-weight: 750;
        }


        .recent-avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;
        }


        .recent-info {
            min-width: 0;

            flex: 1;
        }


        .recent-name {
            margin-bottom: 4px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            color: #f2f3f5;

            font-size: 15px;
            font-weight: 700;
        }


        .recent-url {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            color: #949ba4;

            font-size: 12px;
        }


        .recent-arrow {
            flex: 0 0 auto;

            color: #949ba4;

            font-size: 20px;
        }


        .divider {
            height: 1px;

            margin: 0 0 20px;

            background:
                    rgba(255, 255, 255, 0.06);
        }


        input {
            width: 100%;

            padding: 12px;

            border:
                    1px solid #444;

            border-radius: 6px;

            outline: none;

            background: #1e1f22;

            color: white;

            font-size: 14px;
        }


        input:focus {
            border-color: #5865f2;
        }


        button {
            width: 100%;

            margin-top: 18px;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #5865f2;

            color: white;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
        }


        button:hover:not(:disabled) {
            background: #4752c4;
        }


        button:disabled {
            opacity: 0.6;

            cursor: default;
        }


        #error {
            display: none;

            margin-top: 14px;

            padding: 10px;

            border-radius: 5px;

            background:
                    rgba(
                            255,
                            80,
                            80,
                            0.1
                    );

            color: #ff8080;

            font-size: 12px;

            line-height: 1.4;

            word-break: break-word;
        }

    </style>

</head>


<body>


<div class="box">

    <h1>
        Sharkord Desktop
    </h1>


    <div class="description">
        Escolha o último servidor usado ou digite
        o endereço de outro servidor Sharkord.
    </div>


    <div id="recent">

        <div class="recent-label">
            ÚLTIMO SERVIDOR
        </div>


        <div
                id="recent-card"
                class="recent-card"
                tabindex="0"
                role="button"
        >

            <div
                    id="recent-avatar"
                    class="recent-avatar"
            >
                S
            </div>


            <div class="recent-info">

                <div
                        id="recent-name"
                        class="recent-name"
                >
                    Servidor
                </div>


                <div
                        id="recent-url"
                        class="recent-url"
                ></div>

            </div>


            <div class="recent-arrow">
                ›
            </div>

        </div>

    </div>


    <div
            id="divider"
            class="divider"
            style="display:none"
    ></div>


    <label for="server">
        SERVIDOR
    </label>


    <input
            id="server"
            type="text"
            placeholder="https://sharkord.exemplo.com"
            autocomplete="off"
            spellcheck="false"
    >


    <button id="connect">
        Conectar
    </button>


    <div id="error"></div>

</div>


<script>

    const input =
        document.getElementById(
            "server"
        );


    const button =
        document.getElementById(
            "connect"
        );


    const errorBox =
        document.getElementById(
            "error"
        );


    const recent =
        document.getElementById(
            "recent"
        );


    const recentCard =
        document.getElementById(
            "recent-card"
        );


    const recentAvatar =
        document.getElementById(
            "recent-avatar"
        );


    const recentName =
        document.getElementById(
            "recent-name"
        );


    const recentUrl =
        document.getElementById(
            "recent-url"
        );


    const divider =
        document.getElementById(
            "divider"
        );


    let lastProfile =
        null;


    function getInitials(
        name
    ) {

        const parts =
            String(
                name || "Servidor"
            )
                .trim()
                .split(
                    /\s+/
                )
                .filter(Boolean);


        return parts
                .slice(
                    0,
                    2
                )
                .map(
                    part =>
                        part[0]?.toUpperCase() ||
                        ""
                )
                .join("") ||
            "S";
    }


    function showError(message) {

        errorBox.textContent =
            message;

        errorBox.style.display =
            "block";
    }


    function hideError() {

        errorBox.style.display =
            "none";

        errorBox.textContent =
            "";
    }


    function renderLastServer(
        profile
    ) {

        if (
            !profile ||
            !profile.url
        ) {

            recent.style.display =
                "none";

            divider.style.display =
                "none";

            return;
        }


        lastProfile =
            profile;


        recentName.textContent =
            profile.name ||
            "Servidor";


        try {

            recentUrl.textContent =
                new URL(
                    profile.url
                ).host;

        } catch {

            recentUrl.textContent =
                profile.url;
        }


        recentAvatar.textContent =
            "";


        if (
            profile.avatarDataUrl
        ) {

            const img =
                document.createElement(
                    "img"
                );


            img.alt =
                "";


            img.addEventListener(
                "error",
                () => {

                    img.remove();


                    recentAvatar.textContent =
                        getInitials(
                            profile.name
                        );
                },
                {
                    once:
                        true
                }
            );


            img.src =
                profile.avatarDataUrl;


            recentAvatar.appendChild(
                img
            );

        } else {

            recentAvatar.textContent =
                getInitials(
                    profile.name
                );
        }


        recent.style.display =
            "block";


        divider.style.display =
            "block";
    }


    async function loadLastServer() {

        try {

            const [
                last,
                profile
            ] =
                await Promise.all([
                    window
                        .serverPicker
                        .getLastServer(),

                    window
                        .serverPicker
                        .getLastServerProfile()
                ]);


            if (last) {

                input.value =
                    last;
            }


            if (profile) {

                renderLastServer(
                    profile
                );
            }


            input.focus();

            input.setSelectionRange(
                input.value.length,
                input.value.length
            );

        } catch (error) {

            console.error(
                "Erro lendo último servidor:",
                error
            );


            input.focus();
        }
    }


    function useLastServer() {

        if (
            !lastProfile?.url
        ) {
            return;
        }


        input.value =
            lastProfile.url;


        hideError();


        input.focus();


        input.setSelectionRange(
            input.value.length,
            input.value.length
        );
    }


    async function connect() {

        let url =
            input.value.trim();


        if (!url) {

            showError(
                "Digite o endereço do servidor."
            );

            return;
        }


        hideError();


        if (
            !url.startsWith("http://") &&
            !url.startsWith("https://")
        ) {

            url =
                "https://" + url;
        }


        try {

            const parsed =
                new URL(url);


            if (
                parsed.protocol !== "http:" &&
                parsed.protocol !== "https:"
            ) {

                throw new Error();
            }

        } catch {

            showError(
                "O endereço informado não é válido."
            );

            return;
        }


        button.disabled =
            true;


        button.textContent =
            "Conectando...";


        input.disabled =
            true;


        recentCard.style.pointerEvents =
            "none";


        try {

            await window
                .serverPicker
                .connect(url);

        } catch (error) {

            console.error(
                "Erro ao conectar:",
                error
            );


            showError(
                error?.message
                    ? "Erro: " + error.message
                    : "Não foi possível conectar ao servidor."
            );


            button.disabled =
                false;


            button.textContent =
                "Conectar";


            input.disabled =
                false;


            recentCard.style.pointerEvents =
                "";


            input.focus();
        }
    }


    button.addEventListener(
        "click",
        connect
    );


    recentCard.addEventListener(
        "click",
        useLastServer
    );


    recentCard.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                useLastServer();
            }
        }
    );


    input.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                connect();
            }
        }
    );


    loadLastServer();

</script>


</body>

</html>
