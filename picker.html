<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Compartilhar tela</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            background: #252525;
            color: white;

            font-family:
                    "Segoe UI",
                    Arial,
                    sans-serif;

            overflow: hidden;
        }

        .container {
            height: 100vh;

            display: flex;
            flex-direction: column;
        }


        /* ======================================================
           HEADER
        ====================================================== */

        .header {
            padding: 20px 24px 0;
        }

        .title {
            font-size: 17px;
            font-weight: 600;

            margin-bottom: 7px;
        }

        .subtitle {
            color: #bbb;

            font-size: 12px;

            margin-bottom: 12px;
        }


        /* ======================================================
           TABS
        ====================================================== */

        .tabs {
            display: flex;

            border-bottom:
                    1px solid #555;
        }

        .tab {
            flex: 1;

            padding: 13px;

            text-align: center;

            color: #ccc;

            cursor: pointer;

            position: relative;
        }

        .tab:hover {
            background: #303030;
        }

        .tab.active {
            color: white;
        }

        .tab.active::after {
            content: "";

            position: absolute;

            bottom: -1px;

            left: 20px;
            right: 20px;

            height: 2px;

            background: white;
        }


        /* ======================================================
           SOURCES
        ====================================================== */

        #sourceArea {
            flex: 1;

            overflow-y: auto;

            padding: 20px 24px;
        }

        #sources {
            display: grid;

            grid-template-columns:
        repeat(
            3,
            minmax(0, 1fr)
        );

            gap: 16px;
        }


        /* ======================================================
           CARD
        ====================================================== */

        .source {
            min-width: 0;

            padding: 5px;

            border:
                    2px solid transparent;

            border-radius: 7px;

            cursor: pointer;

            transition: .12s;
        }

        .source:hover {
            background: #333;
        }

        .source.selected {
            background: #343434;

            border-color: #60a5fa;
        }


        /* ======================================================
           PREVIEW
        ====================================================== */

        .preview {
            width: 100%;

            aspect-ratio: 16 / 9;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: #181818;

            border-radius: 4px;
        }

        .preview img.screen-preview {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }


        /* ======================================================
           WINDOW
        ====================================================== */

        .window-placeholder {
            background:
                    linear-gradient(
                            145deg,
                            #181818,
                            #202020
                    );
        }

        .window-placeholder-content {
            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 12px;

            padding: 15px;
        }

        .window-icon {
            width: 58px;
            height: 58px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                    rgba(
                            255,
                            255,
                            255,
                            0.05
                    );

            border-radius: 10px;

            font-size: 28px;

            color: #aaa;
        }

        .window-icon img {
            width: 42px;
            height: 42px;

            object-fit: contain;
        }

        .window-title {
            max-width: 100%;

            font-size: 12px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .source-name {
            margin-top: 7px;

            font-size: 12px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* ======================================================
           LOADING
        ====================================================== */

        #loading {
            margin-top: 50px;

            text-align: center;

            color: #bbb;
        }

        .preview.loading {
            background:
                    linear-gradient(
                            110deg,
                            #202020 8%,
                            #303030 18%,
                            #202020 33%
                    );

            background-size:
                    200% 100%;

            animation:
                    loading 1.4s linear infinite;
        }

        @keyframes loading {

            to {
                background-position-x:
                        -200%;
            }
        }


        /* ======================================================
           AUDIO
        ====================================================== */

        .audio-section {
            padding: 13px 24px;

            border-top:
                    1px solid #454545;

            border-bottom:
                    1px solid #454545;

            background: #222;
        }

        .audio-title {
            margin-bottom: 9px;

            font-size: 13px;
            font-weight: 600;

            color: #ddd;
        }

        .audio-options {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        .audio-option {
            display: flex;

            align-items: center;

            gap: 7px;

            padding: 8px 11px;

            border:
                    1px solid #474747;

            border-radius: 6px;

            background: #292929;

            font-size: 12px;

            cursor: pointer;

            user-select: none;
        }

        .audio-option:hover {
            background: #333;
        }

        .audio-option.selected {
            border-color: #4c8bf5;

            background: #263247;
        }

        .audio-option input {
            margin: 0;

            accent-color: #4c8bf5;
        }

        .audio-note {
            margin-top: 8px;

            color: #999;

            font-size: 11px;

            line-height: 1.4;
        }


        /* ======================================================
           FOOTER
        ====================================================== */

        .footer {
            height: 70px;

            flex-shrink: 0;

            padding: 0 24px;

            display: flex;

            align-items: center;
            justify-content: flex-end;

            gap: 9px;
        }

        button {
            padding: 9px 17px;

            border: none;

            border-radius: 5px;

            color: white;

            cursor: pointer;
        }

        #cancel {
            background: #3b3b3b;
        }

        #share {
            background: #4c8bf5;
        }

        #share:disabled {
            background: #353535;

            color: #777;

            cursor: default;
        }

    </style>

</head>

<body>


<div class="container">


    <!-- ==================================================
         HEADER
    =================================================== -->

    <div class="header">

        <div class="title">
            Escolha o que compartilhar
        </div>

        <div class="subtitle">
            Selecione uma janela ou uma tela.
        </div>


        <div class="tabs">

            <div
                    class="tab active"
                    data-type="window"
            >
                Janela
            </div>


            <div
                    class="tab"
                    data-type="screen"
            >
                Tela inteira
            </div>

        </div>

    </div>


    <!-- ==================================================
         SOURCES
    =================================================== -->

    <div id="sourceArea">

        <div id="loading">
            Procurando fontes...
        </div>

        <div id="sources"></div>

    </div>


    <!-- ==================================================
         AUDIO
    =================================================== -->

    <div class="audio-section">

        <div class="audio-title">
            Áudio
        </div>


        <div
                class="audio-options"
                id="audioOptions"
        >

            <!-- preenchido por JS -->

        </div>


        <div
                class="audio-note"
                id="audioNote"
        ></div>

    </div>


    <!-- ==================================================
         FOOTER
    =================================================== -->

    <div class="footer">

        <button id="cancel">
            Cancelar
        </button>

        <button
                id="share"
                disabled
        >
            Compartilhar
        </button>

    </div>


</div>


<script>


    // ======================================================
    // ELEMENTOS
    // ======================================================

    const sourcesContainer =
        document.getElementById(
            "sources"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const shareButton =
        document.getElementById(
            "share"
        );


    const cancelButton =
        document.getElementById(
            "cancel"
        );


    const audioOptions =
        document.getElementById(
            "audioOptions"
        );


    const audioNote =
        document.getElementById(
            "audioNote"
        );


    // ======================================================
    // ESTADO
    // ======================================================

    let selectedSourceId =
        null;


    let currentType =
        "window";


    let selectedAudioMode =
        "process";


    let loadGeneration =
        0;


    // ======================================================
    // ÁUDIO
    // ======================================================

    function createAudioOption(
        value,
        label
    ) {

        const wrapper =
            document.createElement(
                "label"
            );


        wrapper.className =
            "audio-option";


        const input =
            document.createElement(
                "input"
            );


        input.type =
            "radio";


        input.name =
            "audioMode";


        input.value =
            value;


        input.checked =
            selectedAudioMode ===
            value;


        const text =
            document.createElement(
                "span"
            );


        text.textContent =
            label;


        wrapper.appendChild(
            input
        );


        wrapper.appendChild(
            text
        );


        if (
            input.checked
        ) {

            wrapper.classList.add(
                "selected"
            );
        }


        input.addEventListener(
            "change",
            () => {

                if (
                    !input.checked
                ) {

                    return;
                }


                selectedAudioMode =
                    value;


                document
                    .querySelectorAll(
                        ".audio-option"
                    )
                    .forEach(
                        element => {

                            element
                                .classList
                                .remove(
                                    "selected"
                                );
                        }
                    );


                wrapper.classList.add(
                    "selected"
                );


                console.log(
                    "Modo de áudio:",
                    selectedAudioMode
                );
            }
        );


        audioOptions.appendChild(
            wrapper
        );
    }


    function renderAudioOptions() {

        audioOptions.innerHTML =
            "";


        // ==================================================
        // JANELA
        // ==================================================

        if (
            currentType ===
            "window"
        ) {

            /*
             * Por padrão usamos áudio isolado.
             */

            if (
                selectedAudioMode !==
                "process" &&
                selectedAudioMode !==
                "loopback" &&
                selectedAudioMode !==
                "none"
            ) {

                selectedAudioMode =
                    "process";
            }


            createAudioOption(
                "process",
                "Somente aplicativo selecionado"
            );


            createAudioOption(
                "loopback",
                "Todo o áudio do sistema"
            );


            createAudioOption(
                "none",
                "Sem áudio"
            );


            audioNote.textContent =
                "O modo “Somente aplicativo” usa o Process Loopback do Windows.";

            return;
        }


        // ==================================================
        // TELA INTEIRA
        // ==================================================

        /*
         * Process audio não faz sentido para monitor.
         */

        if (
            selectedAudioMode ===
            "process"
        ) {

            selectedAudioMode =
                "loopback";
        }


        createAudioOption(
            "loopback",
            "Todo o áudio do sistema"
        );


        createAudioOption(
            "none",
            "Sem áudio"
        );


        audioNote.textContent =
            "Ao compartilhar a tela inteira, o áudio pode ser o áudio global do Windows ou nenhum áudio.";
    }


    // ======================================================
    // CARREGAR FONTES
    // ======================================================

    async function loadSources(
        type
    ) {

        const generation =
            ++loadGeneration;


        currentType =
            type;


        selectedSourceId =
            null;


        shareButton.disabled =
            true;


        sourcesContainer.innerHTML =
            "";


        loading.style.display =
            "block";


        loading.textContent =
            "Procurando fontes...";


        renderAudioOptions();


        try {

            const sources =
                await window
                    .screenPicker
                    .getSources(
                        type
                    );


            if (
                generation !==
                loadGeneration
            ) {

                return;
            }


            loading.style.display =
                "none";


            if (
                !sources ||
                sources.length === 0
            ) {

                loading.style.display =
                    "block";


                loading.textContent =
                    "Nenhuma fonte encontrada.";


                return;
            }


            for (
                const source
                of sources
                ) {

                createSourceCard(
                    source
                );
            }


            if (
                type ===
                "screen"
            ) {

                loadThumbnails(
                    type,
                    generation
                );
            }

        } catch (error) {

            console.error(
                "Erro carregando fontes:",
                error
            );


            loading.style.display =
                "block";


            loading.textContent =
                "Erro ao carregar fontes.";
        }
    }


    // ======================================================
    // CARD
    // ======================================================

    function createSourceCard(
        source
    ) {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "source";


        card.dataset.id =
            source.id;


        const preview =
            document.createElement(
                "div"
            );


        preview.className =
            "preview";


        preview.dataset.previewId =
            source.id;


        // ==================================================
        // JANELA
        // ==================================================

        if (
            currentType ===
            "window"
        ) {

            preview.classList.add(
                "window-placeholder"
            );


            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "window-placeholder-content";


            const icon =
                document.createElement(
                    "div"
                );


            icon.className =
                "window-icon";


            if (
                source.appIcon
            ) {

                const image =
                    document.createElement(
                        "img"
                    );


                image.src =
                    source.appIcon;


                image.draggable =
                    false;


                icon.appendChild(
                    image
                );

            } else {

                icon.textContent =
                    "▣";
            }


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "window-title";


            title.textContent =
                source.name;


            title.title =
                source.name;


            content.appendChild(
                icon
            );


            content.appendChild(
                title
            );


            preview.appendChild(
                content
            );

        } else {

            preview.classList.add(
                "loading"
            );
        }


        const name =
            document.createElement(
                "div"
            );


        name.className =
            "source-name";


        name.textContent =
            source.name;


        name.title =
            source.name;


        // ==================================================
        // CLICK
        // ==================================================

        card.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".source"
                    )
                    .forEach(
                        element => {

                            element
                                .classList
                                .remove(
                                    "selected"
                                );
                        }
                    );


                card.classList.add(
                    "selected"
                );


                selectedSourceId =
                    source.id;


                shareButton.disabled =
                    false;


                console.log(
                    "Fonte selecionada:",
                    {
                        sourceId:
                        selectedSourceId,

                        audioMode:
                        selectedAudioMode
                    }
                );
            }
        );


        // ==================================================
        // DUPLO CLICK
        // ==================================================

        card.addEventListener(
            "dblclick",
            () => {

                shareSource(
                    source.id
                );
            }
        );


        card.appendChild(
            preview
        );


        card.appendChild(
            name
        );


        sourcesContainer.appendChild(
            card
        );
    }


    // ======================================================
    // THUMBNAILS
    // ======================================================

    async function loadThumbnails(
        type,
        generation
    ) {

        try {

            const thumbnails =
                await window
                    .screenPicker
                    .getThumbnails(
                        type
                    );


            if (
                generation !==
                loadGeneration
            ) {

                return;
            }


            for (
                const item
                of thumbnails
                ) {

                const preview =
                    Array
                        .from(
                            document.querySelectorAll(
                                "[data-preview-id]"
                            )
                        )
                        .find(
                            element =>
                                element.dataset.previewId ===
                                item.id
                        );


                if (!preview) {

                    continue;
                }


                preview.classList.remove(
                    "loading"
                );


                if (
                    !item.thumbnail
                ) {

                    preview.textContent =
                        "Prévia indisponível";


                    continue;
                }


                const image =
                    document.createElement(
                        "img"
                    );


                image.src =
                    item.thumbnail;


                image.className =
                    "screen-preview";


                image.draggable =
                    false;


                preview.innerHTML =
                    "";


                preview.appendChild(
                    image
                );
            }

        } catch (error) {

            console.error(
                "Erro carregando thumbnails:",
                error
            );
        }
    }


    // ======================================================
    // COMPARTILHAR
    // ======================================================

    function shareSource(
        sourceId
    ) {

        if (!sourceId) {

            return;
        }


        /*
         * Segurança extra:
         *
         * nunca permitir "process"
         * para monitor.
         */

        let audioMode =
            selectedAudioMode;


        if (
            currentType ===
            "screen" &&
            audioMode ===
            "process"
        ) {

            audioMode =
                "loopback";
        }


        console.log(
            "Enviando fonte:",
            {
                sourceId,
                type:
                currentType,

                audioMode
            }
        );


        shareButton.disabled =
            true;


        window
            .screenPicker
            .selectSource({
                sourceId,
                audioMode
            });
    }


    // ======================================================
    // TABS
    // ======================================================

    document
        .querySelectorAll(
            ".tab"
        )
        .forEach(
            tab => {

                tab.addEventListener(
                    "click",
                    () => {

                        const newType =
                            tab.dataset.type;


                        if (
                            newType ===
                            currentType
                        ) {

                            return;
                        }


                        document
                            .querySelectorAll(
                                ".tab"
                            )
                            .forEach(
                                element => {

                                    element
                                        .classList
                                        .remove(
                                            "active"
                                        );
                                }
                            );


                        tab.classList.add(
                            "active"
                        );


                        /*
                         * Definimos um padrão apropriado
                         * ao trocar de categoria.
                         */

                        if (
                            newType ===
                            "window"
                        ) {

                            selectedAudioMode =
                                "process";

                        } else {

                            selectedAudioMode =
                                "loopback";
                        }


                        loadSources(
                            newType
                        );
                    }
                );
            }
        );


    // ======================================================
    // BOTÕES
    // ======================================================

    shareButton.addEventListener(
        "click",
        () => {

            if (
                selectedSourceId
            ) {

                shareSource(
                    selectedSourceId
                );
            }
        }
    );


    cancelButton.addEventListener(
        "click",
        () => {

            window
                .screenPicker
                .cancel();
        }
    );


    // ======================================================
    // TECLADO
    // ======================================================

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Escape"
            ) {

                window
                    .screenPicker
                    .cancel();
            }


            if (
                event.key ===
                "Enter" &&
                selectedSourceId
            ) {

                shareSource(
                    selectedSourceId
                );
            }
        }
    );


    // ======================================================
    // START
    // ======================================================

    selectedAudioMode =
        "process";


    renderAudioOptions();


    loadSources(
        "window"
    );

</script>

</body>

</html>
